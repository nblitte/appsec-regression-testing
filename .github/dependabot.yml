version: 2
updates:
  # Dépendances Python (requirements.txt) : une seule PR groupée par semaine
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  # Actions GitHub utilisées par les workflows : une seule PR groupée par semaine
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
